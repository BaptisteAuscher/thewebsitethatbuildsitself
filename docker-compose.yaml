services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      # Add other env vars your Go app needs, e.g.:
      # - DATABASE_URL=postgres://user:pass@db:5432/mydb
      # - CLICKHOUSE_DSN=clickhouse://clickhouse:9000/default
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
